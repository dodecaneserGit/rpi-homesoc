server:
    chroot: ""
    verbosity: 1
    interface: 0.0.0.0
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    do-ip6: no
    prefer-ip4: yes

    # Validación DNSSEC
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    edns-buffer-size: 1232
    prefetch: yes
    prefetch-key: yes

    # Control de acceso LAN
    access-control: 127.0.0.1/32 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow
    access-control: 10.0.0.0/8 allow

    # Optimización de caché para RPi 3 (1GB)
    msg-cache-size: 8m
    rrset-cache-size: 16m
    infra-cache-numhosts: 2500
