{
    "device.node_id": "homesoc-canary-zero",
    "ip.ignorelist": [
        "127.0.0.1",
        "192.168.1.51",
        "192.168.1.40",
        "192.168.1.39",
        "192.168.1.2",
        "192.168.1.3"
    ],
    "logtype.ignorelist": [
        1001
    ],
    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": {
                    "format": "%(message)s"
                }
            },
            "handlers": {
                "file": {
                    "class": "logging.FileHandler",
                    "filename": "/var/log/opencanary/opencanary.log"
                },
                "console": {
                    "class": "logging.StreamHandler"
                },
                "telegram": {
                    "class": "opencanary.logger.WebhookHandler",
                    "url": "https://api.telegram.org/bot<YOUR_TELEGRAM_BOT_TOKEN>/sendMessage",
                    "method": "POST",
                    "data": {
                        "chat_id": "<YOUR_TELEGRAM_CHAT_ID>",
                        "text": "%(message)s",
                        "parse_mode": "Markdown"
                    },
                    "status_code": 200,
                    "ignore": ["Canary running", "Added service", "Ran startYourEngines"]
                }
            }
        }
    },
    "ftp.enabled": true,
    "ftp.port": 21,
    "ftp.banner": "FTP server ready",

    "http.enabled": true,
    "http.port": 80,
    "http.banner": "Apache/2.4.41 (Ubuntu)",
    "http.skin": "nasLogin",

    "ssh.enabled": true,
    "ssh.port": 2222,
    "ssh.version": "SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5",

    "smb.enabled": true,
    "smb.audit_file": "/var/log/opencanary/smb.log",

    "redis.enabled": true,
    "redis.port": 6379,

    "mysql.enabled": true,
    "mysql.port": 3306,
    "mysql.banner": "5.7.33-0ubuntu0.18.04.1"
}
