version: "3.8"

services:
  # ── 1. UNBOUND RESOLVER SECUNDARIO (Puerto 5335) ──
  unbound-secondary:
    image: klutchell/unbound:latest
    container_name: unbound-secondary
    restart: unless-stopped
    ports:
      - "5335:5335/udp"
      - "5335:5335/tcp"
    volumes:
      - ./unbound/unbound.conf:/etc/unbound/unbound.conf:ro
    environment:
      - TZ=Europe/Madrid
    command: ["-d"]
    deploy:
      resources:
        limits:
          memory: 40M

  # ── 2. ADGUARD HOME SECUNDARIO (Failover DNS en :53) ──
  adguard-secondary:
    image: adguard/adguardhome:latest
    container_name: adguard-secondary
    restart: unless-stopped
    depends_on:
      - unbound-secondary
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
      - "8085:80/tcp"
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
    deploy:
      resources:
        limits:
          memory: 220M

  # ── 3. CROWDSEC AGENT (Sensor que reporta al LAPI de la RPi 4) ──
  crowdsec-agent:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec-agent
    restart: unless-stopped
    environment:
      - DISABLE_LOCAL_API=true
      - AGENT_USERNAME=rpi3-agent
      - AGENT_PASSWORD=${CROWDSEC_AGENT_PASSWORD:-SecretPassRPi3!}
      - LOCAL_API_URL=http://${NODE1_IP:-192.168.1.2}:8080
      - COLLECTIONS=crowdsecurity/linux crowdsecurity/sshd LePresidente/adguardhome
    volumes:
      - ./crowdsec-agent/config:/etc/crowdsec
      - ./crowdsec-agent/data:/var/lib/crowdsec/data
      - /var/log:/var/log:ro
      - ./adguard/work:/var/log/adguard:ro
    deploy:
      resources:
        limits:
          memory: 80M
